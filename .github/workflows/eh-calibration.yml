name: Calibration EH

# Télécharge les tables Eurostat directement, recalcule les paramètres de calibration de l'Économie
# Homéostatique et enregistre le résultat avec la provenance de chaque fichier (URL, date, SHA-256).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 3 * *"   # le 3 de chaque mois

permissions:
  contents: write

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest tests.test_eh_beta_pub tests.test_eh_irnr tests.test_eh_iee -v
      - name: Téléchargement et calcul
        run: |
          python -m pipeline fetch eh_beta_pub eh_irnr eh_iee eh_ibd --force
          python -m pipeline process eh_beta_pub eh_irnr eh_iee eh_ibd
      - name: Copie des résultats
        run: |
          mkdir -p calibration/provenance
          cp data/interim/eh_beta_pub.json calibration/beta_pub.json
          cp data/raw/eh_beta_pub/manifest.json calibration/provenance/beta_pub.manifest.json
          cp data/interim/eh_irnr.json calibration/irnr_series.json
          cp data/raw/eh_irnr/manifest.json calibration/provenance/irnr.manifest.json
          cp data/interim/eh_iee.json calibration/iee_series.json
          cp data/raw/eh_iee/manifest.json calibration/provenance/iee.manifest.json
          cp data/interim/eh_ibd.json calibration/ibd_series.json
          cp data/raw/eh_ibd/manifest.json calibration/provenance/ibd.manifest.json
          for f in data/raw/eh_irnr/*.erreur.txt data/raw/eh_iee/*.erreur.txt data/raw/eh_ibd/*.erreur.txt; do
            [ -e "$f" ] && cp "$f" "calibration/provenance/$(basename "$(dirname "$f")")_$(basename "$f")"
          done; true
      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add calibration
          git diff --cached --quiet || git commit -m "Calibration EH : séries recalculées depuis Eurostat"
          git push
