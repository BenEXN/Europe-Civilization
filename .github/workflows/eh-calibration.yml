name: Calibration EH

# Télécharge les tables Eurostat directement, recalcule les paramètres de calibration de l'Économie
# Homéostatique et enregistre le résultat avec la provenance de chaque fichier (URL, date, SHA-256).
#
# Un lot n'est enregistré que si toutes les étapes réussissent : tables requises présentes et à jour, contrôles après
# calcul, archive des réponses brutes, rejeu hors réseau identique. Sinon le dernier lot publié reste en place.
# Chaque lot est archivé (réponses brutes, manifestes, environnement) comme publication GitHub nommée d'après le lot,
# référencée dans calibration/provenance/lot.json.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 3 * *"   # le 3 de chaque mois, 06:17 UTC
  push:
    branches: [main]
    paths:
      - "pipeline/sources/eh_*.py"
      - "analyse/**"
      - "!analyse/carte_eh.py"
      - ".github/workflows/eh-calibration.yml"

permissions:
  contents: read

# Même groupe que le workflow « Carte EH » : les deux écrivent sur main, leurs exécutions sont sérialisées.
concurrency:
  group: eh-ecriture-main
  cancel-in-progress: false

jobs:
  calibration:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # enregistrement du lot et publication de son archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests du code
        run: python -m unittest tests.test_eh_beta_pub tests.test_eh_irnr tests.test_eh_iee tests.test_eh_lot tests.test_sensibilite_ied tests.test_evolution_ied tests.test_eh_entreprises -v
      - name: Téléchargement
        run: python -m pipeline fetch eh_beta_pub eh_irnr eh_iee eh_ibd eh_entreprises --force
      - name: Incidents du téléchargement (consignés même si le traitement échoue)
        if: always()
        run: |
          mkdir -p incidents
          : > incidents/incidents.log
          for f in data/raw/eh_*/*.erreur.txt; do
            [ -e "$f" ] || continue
            nom="$(basename "$(dirname "$f")")_$(basename "$f")"
            printf '%s\t%s\t%s\t%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_RUN_ID}" "$nom" \
              "$(sed -n 2,3p "$f" | tr '\n' ' ')" >> incidents/incidents.log
          done
      - name: Traitement (arrêt si une table requise manque ou est périmée)
        run: python -m pipeline process eh_beta_pub eh_irnr eh_iee eh_ibd eh_entreprises
      - name: Copie des résultats et état des incidents
        run: |
          mkdir -p calibration/provenance
          rm -f calibration/provenance/*.erreur.txt
          cp data/interim/eh_beta_pub.json calibration/beta_pub.json
          cp data/raw/eh_beta_pub/manifest.json calibration/provenance/beta_pub.manifest.json
          cp data/interim/eh_irnr.json calibration/irnr_series.json
          cp data/raw/eh_irnr/manifest.json calibration/provenance/irnr.manifest.json
          cp data/interim/eh_iee.json calibration/iee_series.json
          cp data/raw/eh_iee/manifest.json calibration/provenance/iee.manifest.json
          cp data/interim/eh_ibd.json calibration/ibd_series.json
          cp data/raw/eh_ibd/manifest.json calibration/provenance/ibd.manifest.json
          cp data/interim/eh_entreprises.json calibration/entreprises_series.json
          cp data/raw/eh_entreprises/manifest.json calibration/provenance/entreprises.manifest.json
          for f in data/raw/eh_*/*.erreur.txt; do
            [ -e "$f" ] || continue
            nom="$(basename "$(dirname "$f")")_$(basename "$f")"
            cp "$f" "calibration/provenance/$nom"
          done
          cat incidents/incidents.log >> calibration/provenance/incidents.log
      - name: Analyse de sensibilité de l'IED
        run: python analyse/sensibilite_ied.py
      - name: Écodotations rapportées au PIB
        run: python analyse/ecodotations.py
      - name: Évolution de l'IED, 2015–2023
        run: python analyse/evolution_ied.py
      - name: Contrôles du lot
        run: python analyse/lot_calibration.py controler
      - name: Archive du lot
        run: python analyse/lot_calibration.py archiver lots
      - name: Rejeu hors réseau (intégrité de l'archive, séries et résultats)
        run: python analyse/lot_calibration.py rejouer lots/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: lot-calibration-eh
          path: lots/*.tar.gz
          retention-days: 90
      # La publication de l'archive précède l'enregistrement des résultats : un lot n'apparaît sur main que si son
      # archive est publiée et vérifiée. Un échec de l'enregistrement laisse une publication sans résultats associés,
      # que le lot suivant ne réutilise pas (nom de lot horodaté).
      - name: Publication de l'archive du lot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lot=$(python -c 'import json; print(json.load(open("calibration/provenance/lot.json"))["lot"])')
          gh release view "$lot" >/dev/null 2>&1 || gh release create "$lot" lots/"$lot".tar.gz --target "$GITHUB_SHA" \
            --title "$lot" --notes "Réponses Eurostat brutes, manifestes et environnement du lot $lot (calibration/provenance/lot.json)."
          mkdir -p verif && gh release download "$lot" --pattern "$lot.tar.gz" --dir verif --clobber
          python analyse/lot_calibration.py verifier verif/"$lot".tar.gz
      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add calibration
          git diff --cached --quiet && exit 0
          git commit -m "Calibration EH : lot $(python -c 'import json; print(json.load(open("calibration/provenance/lot.json"))["lot"])')"
          for essai in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
      - name: Historique exhaustif des incidents (branche eh-incidents)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s incidents/incidents.log ] || { [ "${{ job.status }}" = "success" ] && exit 0; }
          [ -s incidents/incidents.log ] || printf '%s\t%s\t%s\t%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${GITHUB_RUN_ID}" "lot" "échec du workflow (${{ job.status }}) sans trace de téléchargement" > incidents/incidents.log
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          rm -rf ../incidents-branche
          if git fetch origin eh-incidents 2>/dev/null; then
            git worktree add ../incidents-branche FETCH_HEAD
            git -C ../incidents-branche switch -c eh-incidents
          else
            git worktree add --detach ../incidents-branche
            git -C ../incidents-branche switch --orphan eh-incidents
          fi
          cat incidents/incidents.log >> ../incidents-branche/incidents.log
          git -C ../incidents-branche add incidents.log
          git -C ../incidents-branche commit -m "Incidents de calibration : exécution ${GITHUB_RUN_ID}"
          git -C ../incidents-branche push origin eh-incidents
