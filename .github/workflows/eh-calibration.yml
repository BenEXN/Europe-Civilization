name: Calibration EH

# Télécharge les tables Eurostat directement, recalcule les paramètres de calibration de l'Économie
# Homéostatique et enregistre le résultat avec la provenance de chaque fichier (URL, date, SHA-256).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 3 * *"   # le 3 de chaque mois

permissions:
  contents: write

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest tests.test_eh_beta_pub -v
      - name: Téléchargement et calcul
        run: |
          python -m pipeline fetch eh_beta_pub --force
          python -m pipeline process eh_beta_pub
      - name: Copie des résultats
        run: |
          mkdir -p calibration/provenance
          cp data/interim/eh_beta_pub.json calibration/beta_pub.json
          cp data/raw/eh_beta_pub/manifest.json calibration/provenance/beta_pub.manifest.json
      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add calibration
          git diff --cached --quiet || git commit -m "Calibration EH : β_pub recalculé depuis Eurostat"
          git push
